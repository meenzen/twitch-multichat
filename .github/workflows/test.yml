name: "Test"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # started by bun-nix.yml after it pushes to a Renovate branch
  workflow_dispatch:

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: meenzen
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build and test
        run: nix develop -c ci

      - name: Check that bun.nix matches bun.lock
        run: |
          git diff --exit-code bun.nix || {
            echo "::error file=bun.nix::bun.nix is out of date, run 'bun2nix -o bun.nix' in nix develop and commit it"
            exit 1
          }

  # git hooks on all files, the Nix package and the NixOS module (VM test,
  # see nix/test.nix)
  nix:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
      - uses: cachix/cachix-action@v17
        with:
          name: meenzen
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Build the package and run the NixOS test
        run: nix flake check -L
