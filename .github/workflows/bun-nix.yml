name: "Update bun.nix"

# Renovate changes bun.lock but can't run bun2nix, so this commits the
# regenerated bun.nix to its branch. Pushes with GITHUB_TOKEN start no
# workflows, so the tests are started for the new commit by hand.
on:
  pull_request:
    paths:
      - bun.lock

permissions:
  contents: write
  actions: write

jobs:
  bun-nix:
    if: startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: cachix/install-nix-action@v31
      # pulls from and pushes to the cache the servers deploy from
      - uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0.5.2
        with:
          endpoint: https://attic.mnzn.dev
          cache: main
          token: ${{ secrets.ATTIC_TOKEN }}

      # the bun2nix pinned in flake.lock
      - name: Regenerate bun.nix
        run: nix run --inputs-from . bun2nix -- -o bun.nix

      - name: Commit and test
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet bun.nix; then
            echo "bun.nix is up to date"
            exit 0
          fi
          # listed in renovate.json's gitIgnoredAuthors, so Renovate keeps
          # rebasing the branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): update bun.nix" bun.nix
          git push origin "HEAD:$BRANCH"
          gh workflow run test.yml --ref "$BRANCH"
